name: scrape doctormobile.lk

# 2026-10-24: answers GitHub's runners with 403 (Cloudflare blocks data-centre
# addresses) but works from a home connection. Manual runs only, to check
# whether the block has lifted.
on:
  workflow_dispatch:

jobs:
  scrape:
    uses: ./.github/workflows/scrape.yml
    with:
      shop: doctormobile.lk
      timeout_minutes: 10
    secrets: inherit
