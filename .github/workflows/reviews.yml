name: reviews

# YouTube reviews for phone pages, through the YouTube Data API's free quota.
# 21:00 UTC is 02:30 in Sri Lanka, before normalize (03:00), whose last step
# clears the site cache and so puts new reviews live.
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One run at a time; the lease in pipeline_runs also covers a local run.
    concurrency:
      group: reviews
      cancel-in-progress: false

    steps:
      - name: Require configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::DATABASE_URL or YOUTUBE_API_KEY is not set. Add them under Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Reviews
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        # Without pipefail the exit code is tee's, so a failed run would show green.
        run: |
          set -o pipefail
          status=0
          npm run reviews 2>&1 | tee /tmp/reviews.log || status=$?
          echo "### reviews" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(reviews:|  )' /tmp/reviews.log >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$status" -ne 0 ]; then tail -5 /tmp/reviews.log >> "$GITHUB_STEP_SUMMARY"; fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status
