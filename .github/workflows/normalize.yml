name: normalize

# Nightly matching: raw_listings -> phones, listings, price_history.
# 21:30 UTC is 03:00 in Sri Lanka, after the 01:30 home-PC scrape.
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two overlapping runs would race on the same unprocessed rows.
    concurrency:
      group: normalize
      cancel-in-progress: false

    steps:
      # Fail before installing anything: without a database there is nothing to do.
      - name: Require configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set. Add it under Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi

      # Not an error: the job still matches by rules, and unclear warranty text
      # is filed as 'unstated' until the key is added.
      - name: Check model key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set. The model fallback is off; unclear warranty text is filed as 'unstated' and unclear titles are dropped."
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Normalize
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Without pipefail the pipeline's exit code is tee's, so a failed run
        # would show green (see scrape.yml). The status is held until the summary
        # is written, because a failed run is when it matters.
        run: |
          set -o pipefail
          status=0
          npm run normalize 2>&1 | tee /tmp/normalize.log || status=$?
          echo "### normalize" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(resolved|dropped:|model:|wrote) ' /tmp/normalize.log >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$status" -ne 0 ]; then tail -5 /tmp/normalize.log >> "$GITHUB_STEP_SUMMARY"; fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Pages and cached reads keep for a day (Neon's free transfer can't take
      # more frequent refreshes), so this call is what puts the night's prices
      # on the site. A failure costs freshness, not data; the next run tries again.
      - name: Clear the site's catalog cache
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$REVALIDATE_SECRET" ]; then
            echo "::warning::SITE_URL (variable) or REVALIDATE_SECRET (secret) is not set. The site serves cached prices for up to a day."
            exit 0
          fi
          code=$(curl -s -o /tmp/revalidate.out -w '%{http_code}' -X POST -H "Authorization: Bearer $REVALIDATE_SECRET" "$SITE_URL/api/revalidate")
          echo "revalidate -> HTTP $code"
          cat /tmp/revalidate.out || true
          [ "$code" = "200" ] || echo "::warning::Cache revalidation failed (HTTP $code)."
